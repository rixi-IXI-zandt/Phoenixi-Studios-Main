<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONTACT — Phoenixi Studios</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <div class="viewport-frame" id="contact-viewport">
    <!-- Upper Left Decorative Page Frame Corner Overlay -->
    <img src="/assets/PageFrame-UpperRight-1080x693px.png" alt="" class="page-frame-upper-left" id="contact-frame-corner">
    
    <!-- Header with logo and CONTACT title -->
    <header class="site-header" id="contact-header">
      <a href="index.html" class="header-logo-link" id="contact-logo-link">
        <img src="/assets/PhoenixiStudio-Logo-512x512-FullColor.png" alt="Phoenixi Studios" class="header-logo-img" id="contact-logo-img">
      </a>
      
      <div class="header-divider-wrapper" id="contact-divider-wrapper">
        <div class="header-side-line left" id="contact-line-left"></div>
        <div class="page-title-badge" id="page-title-contact">CONTACT</div>
        <div class="header-side-line right" id="contact-line-right"></div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="contact-container" id="contact-main">
      <!-- Contact Cards Grid: Discord & Email -->
      <section class="contact-center-section" id="contact-center-section">
        <!-- Discord Card -->
        <a href="https://discord.gg/D6hDNAtXMY" target="_blank" rel="noopener noreferrer" class="contact-card discord" id="discord-contact-card">
          <div class="contact-icon-wrapper" id="discord-icon-wrapper">
            <img src="/assets/icons/discord.svg" alt="Discord Phoenixi Studios" class="contact-icon-img" id="discord-icon-img">
          </div>
          
          <div class="contact-card-details" id="discord-card-details">
            <span class="contact-card-tag mint" id="discord-card-tag">OFFICIAL COMMUNITY</span>
            <h2 class="contact-card-title" id="discord-card-title">PHOENIXI DISCORD</h2>
            <p class="contact-card-sub" id="discord-card-sub">Join creators, artists, and worldbuilders in the IXI sanctuary.</p>
            
            <div class="contact-action-btn mint" id="discord-join-btn">
              <span>JOIN SERVER</span>
              <span class="btn-arrow">→</span>
            </div>
          </div>
        </a>

        <!-- Direct Email Contact Card -->
        <div class="contact-card email" id="email-contact-card">
          <div class="contact-icon-wrapper" id="email-icon-wrapper">
            <svg class="contact-svg-icon cyan" viewBox="0 0 24 24" width="48" height="48">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
              <polyline points="22,6 12,13 2,6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></polyline>
            </svg>
          </div>

          <div class="contact-card-details" id="email-card-details">
            <span class="contact-card-tag cyan" id="email-card-tag">DIRECT INQUIRIES</span>
            <h2 class="contact-card-title" id="email-card-title">EMAIL US</h2>
            <p class="contact-card-sub" id="email-card-sub">Reach our team for press, software collaborations, or general questions.</p>
            
            <a href="mailto:rixizandt@gmail.com" class="contact-action-btn cyan" id="email-send-btn">
              <span>RIXIZANDT@GMAIL.COM</span>
              <span class="btn-arrow">→</span>
            </a>
          </div>
        </div>
      </section>

      <!-- Bottom Vertical Mint Lines -->
      <section class="contact-mint-lines-bottom" id="contact-mint-lines-bottom">
        <div class="mint-line-vertical" id="contact-mint-line-1"></div>
        <div class="mint-line-vertical" id="contact-mint-line-2"></div>
      </section>

      <!-- Back to Top Navigation Button -->
      <button type="button" class="back-to-top-btn" id="back-to-top-btn" aria-label="Back to Top">
        <span class="top-arrow">▲</span>
        <span class="top-text">BACK TO TOP</span>
      </button>
    </main>

  </div>

  <script src="/js/main.js"></script>
</body>
</html>
