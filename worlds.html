<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORLDS — Phoenixi Studios</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <div class="viewport-frame" id="worlds-viewport">
    <!-- Upper Left Decorative Page Frame Corner Overlay -->
    <img src="/assets/PageFrame-UpperRight-1080x693px.png" alt="" class="page-frame-upper-left" id="worlds-frame-corner">
    
    <!-- Header with logo and WORLDS title -->
    <header class="site-header" id="worlds-header">
      <a href="index.html" class="header-logo-link" id="worlds-logo-link">
        <img src="/assets/PhoenixiStudio-Logo-512x512-FullColor.png" alt="Phoenixi Studios" class="header-logo-img" id="worlds-logo-img">
      </a>
      
      <div class="header-divider-wrapper" id="worlds-divider-wrapper">
        <div class="header-side-line left" id="worlds-line-left"></div>
        <div class="page-title-badge" id="page-title-worlds">WORLDS</div>
        <div class="header-side-line right" id="worlds-line-right"></div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="worlds-container" id="worlds-main">
      <!-- Worlds Catalogue Container -->
      <section class="worlds-list" id="worlds-list-container">
        <!-- Static HTML fallbacks (populated dynamically via js/worlds.js from data/worlds.json) -->
        <a href="#" class="world-card" id="world-card-ixi-house">IXI House</a>
        <a href="#" class="world-card" id="world-card-phoenixi">Phoenixi</a>
        <a href="#" class="world-card" id="world-card-ixi-family">IXI Family</a>
      </section>

      <!-- Bottom Pink Geometric Symbol & Back to Top -->
      <div class="worlds-bottom-symbol" id="worlds-bottom-symbol">
        <img src="/assets/artwork/pink-symbol.svg" alt="Pink Geometric Symbol" id="pink-symbol-img">
      </div>

      <!-- Back to Top Navigation Button -->
      <button type="button" class="back-to-top-btn" id="back-to-top-btn" aria-label="Back to Top">
        <span class="top-arrow">▲</span>
        <span class="top-text">BACK TO TOP</span>
      </button>
    </main>

  </div>

  <script src="/js/main.js"></script>
  <script src="/js/worlds.js"></script>
</body>
</html>
