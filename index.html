<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phoenixi Studios</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <div class="viewport-frame" id="landing-viewport">
    <!-- Upper Left Decorative Page Frame Corner Overlay -->
    <img src="/assets/PageFrame-UpperRight-1080x693px.png" alt="" class="page-frame-upper-left" id="landing-frame-corner">
    
    <main class="landing-container" id="landing-main">
      <!-- Top Logo Area -->
      <header class="landing-header" id="landing-header">
        <a href="index.html" class="header-logo-link" id="logo-link">
          <img src="/assets/PhoenixiStudio-Logo-512x512-FullColor.png" alt="Phoenixi Studios" class="logo-img" id="landing-logo-img">
        </a>
      </header>

      <!-- Down Pointer Arrow with Center Diamond -->
      <div class="landing-pointer" id="landing-pointer">
        <div class="pointer-line-top" id="pointer-line-top"></div>
        <div class="pointer-diamond" id="pointer-diamond"></div>
        <div class="pointer-line-bottom" id="pointer-line-bottom"></div>
      </div>

      <!-- Essence Mottos: CREATE. IMAGINE. BUILD. -->
      <section class="landing-essence" id="landing-essence">
        <span class="essence-create" id="essence-create">C R E A T E .</span>
        <span class="essence-imagine" id="essence-imagine">I M A G I N E .</span>
        <span class="essence-build" id="essence-build">B U I L D .</span>
      </section>

      <!-- Identity Text -->
      <section class="landing-description" id="landing-description">
        <p id="desc-line-1">We build worlds, games, stories,</p>
        <p id="desc-line-2">art and software.</p>
        <p id="desc-line-3" style="margin-top: 8px;">Imagination with precision.</p>
      </section>

      <!-- Bottom Navigation Grid (WORLDS | ABOUT | CONTACT) -->
      <nav class="landing-nav-grid" id="landing-nav-grid">
        <a href="worlds.html" class="nav-col" id="nav-col-worlds">
          <span class="nav-col-title cyan" id="title-worlds">WORLDS</span>
          <div class="nav-accent-line cyan" id="accent-worlds">
            <div class="nav-accent-diamond cyan" id="diamond-worlds"></div>
          </div>
        </a>

        <div class="nav-grid-divider" id="divider-1"></div>

        <a href="about.html" class="nav-col" id="nav-col-about">
          <span class="nav-col-title purple" id="title-about">ABOUT</span>
          <div class="nav-accent-line purple" id="accent-about">
            <div class="nav-accent-diamond purple" id="diamond-about"></div>
          </div>
        </a>

        <div class="nav-grid-divider" id="divider-2"></div>

        <a href="contact.html" class="nav-col" id="nav-col-contact">
          <span class="nav-col-title mint" id="title-contact">CONTACT</span>
          <div class="nav-accent-line mint" id="accent-contact">
            <div class="nav-accent-diamond mint" id="diamond-contact"></div>
          </div>
        </a>
      </nav>

      <!-- Horizontal Rule Divider with Center Diamond -->
      <div class="landing-horizontal-divider" id="landing-horizontal-divider">
        <div class="divider-line" id="divider-line-left"></div>
        <div class="divider-diamond" id="divider-diamond-center"></div>
        <div class="divider-line" id="divider-line-right"></div>
      </div>

      <!-- Social Media Icons Row -->
      <section class="landing-social-row" id="landing-social-row">
        <!-- Instagram -->
        <a href="https://www.instagram.com/rixiphoenixi/" target="_blank" rel="noopener noreferrer" class="social-icon-link" id="social-instagram" aria-label="Instagram">
          <svg class="social-svg purple" viewBox="0 0 24 24">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
        </a>

        <!-- Discord -->
        <a href="https://discord.gg/D6hDNAtXMY" target="_blank" rel="noopener noreferrer" class="social-icon-link" id="social-discord" aria-label="Discord">
          <svg class="social-svg deep-purple" viewBox="0 0 24 24">
            <path d="M18 6h0a14.5 14.5 0 0 0-3.5-1.1 0.1 0.1 0 0 0-.1 0 10.2 10.2 0 0 0-.5 1 13.4 13.4 0 0 0-3.8 0 10.2 10.2 0 0 0-.5-1 0.1 0.1 0 0 0-.1 0A14.5 14.5 0 0 0 6 6a15.7 15.7 0 0 0-2.5 9.6 0.1 0.1 0 0 0 0 .1 14.6 14.6 0 0 0 4.4 2.2 0.1 0.1 0 0 0 .1 0 10.4 10.4 0 0 0 .9-1.5 0.1 0.1 0 0 0-.1-.1 9.6 9.6 0 0 1-1.4-.7 0.1 0.1 0 0 1 0-.2c.1 0 .2-.1.3-.1a10.4 10.4 0 0 0 8.6 0c.1 0 .2.1.3.1a0.1 0.1 0 0 1 0 .2 9.6 9.6 0 0 1-1.4.7 0.1 0.1 0 0 0-.1.1 10.4 10.4 0 0 0 .9 1.5 0.1 0.1 0 0 0 .1 0 14.6 14.6 0 0 0 4.4-2.2 0.1 0.1 0 0 0 0-.1A15.7 15.7 0 0 0 18 6zM8.5 13.5c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5zm7 0c-.8 0-1.5-.7-1.5-1.5s.7-1.5 1.5-1.5 1.5.7 1.5 1.5-.7 1.5-1.5 1.5z"></path>
          </svg>
        </a>

        <!-- Email -->
        <a href="contact.html" class="social-icon-link" id="social-email" aria-label="Email">
          <svg class="social-svg mint" viewBox="0 0 24 24">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </a>
      </section>

      <!-- Copyright Footer Text -->
      <footer class="landing-footer-copy" id="landing-footer-copy">
        PHOENIXI STUDIOS &nbsp;©&nbsp; MMXXIV
      </footer>
    </main>
  </div>

  <script src="/js/main.js"></script>
</body>
</html>
