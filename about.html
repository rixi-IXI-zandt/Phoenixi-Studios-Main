<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABOUT — Phoenixi Studios</title>
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/global.css">
</head>
<body>
  <div class="viewport-frame" id="about-viewport">
    <!-- Upper Left Decorative Page Frame Corner Overlay -->
    <img src="/assets/PageFrame-UpperRight-1080x693px.png" alt="" class="page-frame-upper-left" id="about-frame-corner">
    
    <!-- Header with logo and ABOUT title -->
    <header class="site-header" id="about-header">
      <a href="index.html" class="header-logo-link" id="about-logo-link">
        <img src="/assets/PhoenixiStudio-Logo-512x512-FullColor.png" alt="Phoenixi Studios" class="header-logo-img" id="about-logo-img">
      </a>
      
      <div class="header-divider-wrapper" id="about-divider-wrapper">
        <div class="header-side-line left" id="header-line-left"></div>
        <div class="page-title-badge" id="page-title-about">ABOUT</div>
        <div class="header-side-line right" id="header-line-right"></div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="about-container" id="about-main">
      <!-- Content area featuring IXI Crest Artwork -->
      <section class="about-content-area" id="about-content-area">
        <img src="/assets/IXI-Crest.png" alt="Phoenixi IXI Crest" class="about-crest-img" id="ixi-crest-img">
        
        <div class="about-text-card" id="about-text-card">
          <p class="about-identity-heading" id="about-identity-heading">IDENTITY & ESSENCE</p>
          <p class="about-body-text" id="about-body-text-1">
            Phoenixi Studios is a creative house for worlds, games, stories, art, and software.
          </p>
          <p class="about-body-text" id="about-body-text-2">
            We fuse imagination with precision to build meaningful experiences across all mediums.
          </p>

          <!-- Core Motto -->
          <div class="about-core-motto" id="about-core-motto">
            <span class="ixi-tag" id="ixi-tag">IXI</span>
            <span class="motto-divider" id="motto-divider">|</span>
            <span class="motto-text" id="motto-text">ONE CORE. INFINITE WORLDS.</span>
          </div>

          <!-- Color Swatches -->
          <div class="about-swatches-row" id="about-swatches-row">
            <div class="swatch-item" id="swatch-cyan" style="background-color: #6ef0ff;" title="#6EF0FF Cyan"></div>
            <div class="swatch-item" id="swatch-mint" style="background-color: #b8ffd9;" title="#B8FFD9 Mint"></div>
            <div class="swatch-item" id="swatch-purple" style="background-color: #e2b3ff;" title="#E2B3FF Purple"></div>
            <div class="swatch-item" id="swatch-deep" style="background-color: #9b6bff;" title="#9B6BFF Deep Purple"></div>
          </div>
        </div>
      </section>

      <!-- Lower Right Phoenixi/Rixi Artwork -->
      <div class="about-rixi-corner" id="about-rixi-corner">
        <img src="/assets/artwork/rixi-artwork.svg" alt="Phoenixi Rixi Artwork" id="rixi-artwork-img">
      </div>

      <!-- Back to Top Navigation Button -->
      <button type="button" class="back-to-top-btn" id="back-to-top-btn" aria-label="Back to Top">
        <span class="top-arrow">▲</span>
        <span class="top-text">BACK TO TOP</span>
      </button>
    </main>

  </div>

  <script src="/js/main.js"></script>
</body>
</html>
